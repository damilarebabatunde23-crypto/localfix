services:
  - type: web
    name: localfix-app
    env: python
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn localfix_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
